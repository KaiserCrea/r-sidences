<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcf0c8">
<title>Mes Résidences</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fcf0c8;--card:#fff8e0;--line:#f0d888;--line2:#ecc659;--gold:#e0a90f;--honey:#946500;--ink:#46340f;--mu:#957e48;--soft:#f4cf5c;--dark:#5e3f00;--serif:Georgia,"Noto Serif","Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
#main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 20px}
.frame{border:1px solid var(--gold);border-radius:30px;padding:5px;margin-bottom:18px}
.in{border:.5px solid var(--line2);border-radius:25px;padding:20px 16px 16px}
.au{color:var(--honey)}.mu{color:var(--mu)}
.sc{font-size:11px;letter-spacing:3px;text-transform:uppercase}
.serif{font-family:var(--serif)}
.center{text-align:center}
.mono{width:48px;height:48px;margin:0 auto;border-radius:50%;background:var(--soft);border:1px solid #d49b00;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;color:var(--dark)}
.mono.sm{width:36px;height:36px;font-size:15px;margin:0}
.title{font-family:var(--serif);font-style:italic;color:var(--honey);font-size:34px;margin:4px 0 2px;font-weight:400}
.h2{font-family:var(--serif);font-style:italic;color:var(--honey);font-size:28px;margin:4px 0;font-weight:400}
.orn{display:flex;align-items:center;gap:10px;margin:14px 0}
.orn:before,.orn:after{content:"";flex:1;height:.5px;background:var(--gold)}
.orn i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.bar{height:3px;background:var(--line);border-radius:3px;margin:8px 0 2px;overflow:hidden}
.bar>div{height:3px;background:var(--gold);border-radius:3px;transition:width .3s}
.it{display:flex;align-items:flex-start;gap:14px;padding:13px 2px;border-bottom:.5px solid var(--line);font-size:15px;line-height:1.4;cursor:pointer;width:100%;text-align:left}
.it:last-child{border-bottom:0}
.bx{width:24px;height:24px;border:1.2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card);transition:background .2s}
.bx svg{opacity:0;transition:opacity .2s}
.it.on .bx{background:var(--gold)}.it.on .bx svg{opacity:1}
.it.on .tx{color:#bba674;text-decoration:line-through}
.cons{display:block;font-family:var(--serif);font-style:italic;color:var(--honey);font-size:13.5px;margin-top:3px}
.it.on .cons{color:#c7b383}
.box{margin-top:16px;background:var(--soft);padding:12px 14px;border-radius:16px;color:var(--dark)}
.box .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid #e0b43f;font-size:14.5px}
.box .row:first-of-type{border-top:0}
.notes{margin-top:12px;border:.5px solid var(--line2);border-radius:16px;padding:12px 14px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.pill{font-size:10px;letter-spacing:2px;padding:6px 11px;border-radius:20px;white-space:nowrap;text-transform:uppercase}
.pill.go{background:var(--gold);color:#fff8e0}
.pill.wait{border:.5px solid var(--line2);color:var(--honey)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gold);color:var(--honey);border-radius:22px;padding:10px 16px;font-size:14px}
.btn.full{width:100%}
.btn.fill{background:var(--gold);color:#fff8e0;border-color:var(--gold)}
.btn.danger{border-color:#c98b6b;color:#9a4a2a}
.btn.small{padding:6px 12px;font-size:12.5px}
.row2{display:flex;gap:10px;margin-top:14px}.row2>*{flex:1}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.list .li:last-child{border-bottom:0}
.small{font-size:12.5px}
.day{padding:12px 2px;border-bottom:.5px solid var(--line)}
.day:last-child{border-bottom:0}
.day.today .dname{color:var(--honey)}
.dname{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.pas{display:flex;align-items:center;gap:12px;background:var(--card);border:.5px solid var(--line2);border-radius:16px;padding:10px 12px;margin-top:6px;width:100%;text-align:left}
.pas .grow{flex:1}
.weeknav{display:flex;justify-content:space-between;align-items:center}
.arrow{width:40px;height:40px;border-radius:50%;border:.5px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--honey);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);border-radius:20px;padding:7px 12px;font-size:13px;color:var(--mu)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#fff8e0}
label.lb{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.ed{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:.5px solid var(--line)}
.ed .t{flex:1;font-size:14.5px;line-height:1.35}
.ib{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--honey);font-size:16px;flex-shrink:0}
.ib:active{background:var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:.5px solid var(--line2);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu)}
nav button.on{color:var(--honey)}
nav svg{width:22px;height:22px}
#ov{position:fixed;inset:0;background:rgba(70,52,15,.35);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;border-top:1px solid var(--gold);z-index:21;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
#sheet.open{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.seg{display:flex;background:var(--card);border:.5px solid var(--line2);border-radius:22px;padding:3px;margin:12px auto 14px;width:210px}
.seg button{flex:1;padding:7px 0;border-radius:18px;font-size:13.5px;color:var(--mu)}
.seg button.on{background:var(--gold);color:#fff8e0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.wc{border-radius:14px;padding:6px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent}
.wc .wh{font-size:10.5px;color:var(--mu)}.wc .wn{font-size:16px}
.wc.t{border-color:var(--gold)}.wc.t .wn{color:var(--honey)}
.wc.s{background:var(--card);border-color:var(--line2)}.wc.s.t{border-color:var(--gold)}
.wd{font-size:10px;color:var(--mu);height:12px}
.pts{display:flex;gap:2px;justify-content:center;min-height:20px}
.pt{width:20px;height:20px;border-radius:50%;font-family:var(--serif);font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pt.big{width:25px;height:25px;font-size:12.5px}
.pt.sm{width:15px;height:15px;font-size:8.5px;margin-right:5px}
.pt.f{background:var(--gold);color:#fff8e0}
.pt.e{border:1.2px solid var(--gold);color:var(--honey);background:var(--card)}
.pt.mv{border:1.2px dashed var(--honey);color:var(--honey);background:var(--card)}
.pt.z{visibility:hidden}
.edot{width:5px;height:5px;border-radius:50%;background:var(--honey);display:inline-block}
.edot.z{visibility:hidden}
.edot.abs{position:absolute;bottom:4px;right:5px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.mh{font-size:11px;color:var(--mu);padding-bottom:4px}
.mc{height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:2px;font-size:13px;position:relative;border:1px solid transparent}
.mc.o{color:#cdbd92}
.mc.t{border-color:var(--gold)}.mc.t>span:first-child{color:var(--honey);font-weight:600}
.mc.s{background:var(--card);border-color:var(--line2)}.mc.s.t{border-color:var(--gold)}
.det{margin-top:14px;background:var(--card);border:.5px solid var(--line2);border-radius:18px;padding:14px}
.dp+.dp{margin-top:14px;padding-top:14px;border-top:.5px solid var(--line)}
.lg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--mu);justify-content:center;margin:-6px 0 10px}
.lg>span{display:inline-flex;align-items:center;gap:5px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff8e0;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:all .25s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:20px 0 6px}
</style>
</head>
<body>
<main id="main"></main>
<nav id="nav">
  <button data-tab="jour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Aujourd'hui</button>
  <button data-tab="semaine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendrier</button>
  <button data-tab="espacees"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg>Espacées</button>
  <button data-tab="fiches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20.5V9.5L12 4l7 5.5v11z"/><path d="M9.5 20.5v-6h5v6"/></svg>Fiches</button>
</nav>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ---------- Données de départ ---------- */
const KEY = 'mesResidences.v1';
const DEFAULT = {
  residences: [
    { id:'elia', nom:"Les Jardins d'Élia", court:'Élia', mono:'É', jours:[1,4], duree:'2h30',
      adresse:"211 avenue des Anciens Combattants d'Afrique du Nord, 83390 Pierrefeu-du-Var",
      infos:"Code entrée bâtiment : 0212\nPortail en panne, reste ouvert\nEau au RDC dans le placard technique de chaque entrée\nPas de matériel sur place",
      notes:'',
      checklist:[
        {id:'e1', texte:"Sols du RDC au dernier étage : balayage et lavage, escaliers compris", consigne:''},
        {id:'e2', texte:"Nettoyage de la rampe", consigne:''},
        {id:'e3', texte:"Toiles d'araignées : paliers, escaliers, luminaires extérieurs, devant la porte d'entrée", consigne:''},
        {id:'e4', texte:"Vitrerie des portes d'entrée sur les 2 faces", consigne:''},
        {id:'e5', texte:"Ascenseur : rails, parois, sol, porte, miroir, boutons sur les paliers", consigne:"Huile inox ; aspirateur mis à disposition pour les rails"},
        {id:'e6', texte:"Tapis brosse : brossage et balayage dans leur emplacement", consigne:''},
        {id:'e7', texte:"Dépoussiérer sonnettes, plinthes et luminaires des escaliers", consigne:''}
      ]},
    { id:'gaia', nom:'Gaïa', court:'Gaïa', mono:'G', jours:[2,5], duree:'3h00',
      adresse:'110-120 allée des Platanes, 83390 Pierrefeu-du-Var',
      infos:'', notes:'',
      checklist:[
        {id:'g1', texte:"Sols entrées A et B : balayage et lavage", consigne:"Vérifier aussi dans les placards techniques"},
        {id:'g2', texte:"Escaliers des étages : balayage, toiles d'araignées, lavage des luminaires", consigne:''},
        {id:'g3', texte:"Dépoussiérer boîtes aux lettres, plinthes, sonnettes", consigne:''},
        {id:'g4', texte:"Tapis : brossage, enlever la terre dans les rainures, balayer l'emplacement", consigne:''},
        {id:'g5', texte:"Hall : toiles d'araignées, lavage du miroir", consigne:"Attention aux toiles d'araignées"},
        {id:'g6', texte:"Toiles d'araignées sur les paliers", consigne:''},
        {id:'g7', texte:"Portes d'entrée : vitres, encadrements, gonds, traces sur les poignées, aération", consigne:''},
        {id:'g8', texte:"Devant les portes d'entrée : toiles d'araignées au plafond", consigne:''},
        {id:'g9', texte:"Interphones", consigne:"Huile inox"},
        {id:'g10', texte:"Ascenseur complet (cloison, plinthes, miroir, sol) et rails aux étages", consigne:"Huile inox dans l'ascenseur et sur les boutons aux étages"},
        {id:'g11', texte:"Bâtiment A, dans l'allée : balayage et lavage du sol, toiles d'araignées", consigne:"Attention aux toiles sous la cloison"}
      ]}
  ],
  espacees: [
    {id:'s1', res:'elia', texte:'Parking et sous-sol', n:1, per:'mois', duree:'1h30',
     detail:"Toiles d'araignées\nDétritus dans les allées\nBalayage de la descente de garage\nBalayage des SAS (garage et ascenseur) et de l'escalier du sous-sol", consigne:'Utiliser le balai dans le local', fait:null},
    {id:'s2', res:'elia', texte:'Local ordures ménagères', n:2, per:'mois', duree:'1h00',
     detail:'Brossage des containers et du sol avec un désinfectant', consigne:'', fait:null},
    {id:'s3', res:'elia', texte:'Parking : voies de circulation', n:2, per:'an', duree:'1h30',
     detail:'Balayage des voies de circulation', consigne:'Utiliser le balai dans le local', fait:null},
    {id:'s4', res:'gaia', texte:'Escaliers des sous-sols, entrées A et B', n:1, per:'semaine', duree:'',
     detail:"Balayage des escaliers menant aux sous-sols\nToiles d'araignées\nDépoussiérage de la rampe", consigne:'', fait:null},
    {id:'s5', res:'gaia', texte:'SAS ascenseur et garage', n:1, per:'mois', duree:'',
     detail:'Balayage et lavage des SAS', consigne:'', fait:null},
    {id:'s6', res:'gaia', texte:'Déchets dans les allées et abords', n:1, per:'mois', duree:'',
     detail:'Ramassage des déchets', consigne:'', fait:null},
    {id:'s7', res:'gaia', texte:'Plots lumineux extérieurs', n:4, per:'an', duree:'',
     detail:'Dépoussiérage', consigne:'', fait:null}
  ],
  contact: { nom:'SASU Cristiano', tel:'06 28 60 42 07', adresse:'6 rue Pierre Brossolette, 83400 Hyères' },
  checks: {},
  moves: {}
};

/* ---------- Stockage ---------- */
function load(){
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Enregistrement impossible"); } }

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const dow = s => { const g = parse(s).getDay(); return g === 0 ? 7 : g; };
const monday = s => addDays(s, 1 - dow(s));
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const JOURS = ['','lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const longDate = s => { const d = parse(s); return `${JOURS[dow(s)]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const shortDate = s => { const d = parse(s); return `${d.getDate()} ${MOIS[d.getMonth()]}`; };

/* nettoyage des vieilles coches et déplacements */
(function clean(){
  const lim = addDays(today(), -60);
  for (const k of Object.keys(S.checks)) if (k.split('|')[0] < lim) delete S.checks[k];
  for (const k of Object.keys(S.moves)) if (k.split('|')[0] < lim) delete S.moves[k];
  save();
})();

/* ---------- Outils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const resById = id => S.residences.find(r => r.id === id);
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900); }
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff8e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Passages ---------- */
function passagesFor(D){
  const out = [];
  for (const r of S.residences){
    if (r.jours.includes(dow(D))){
      const mv = S.moves[D + '|' + r.id];
      if (!mv || mv === D) out.push({ nat:D, res:r, moved:false });
    }
  }
  for (const [k,v] of Object.entries(S.moves)){
    if (v !== D) continue;
    const [nat, rid] = k.split('|');
    const r = resById(rid);
    if (r && nat !== D && r.jours.includes(dow(nat))) out.push({ nat, res:r, moved:true });
  }
  return out;
}
function nextPassage(from){
  for (let i = 1; i <= 21; i++){ const d = addDays(from, i); const p = passagesFor(d); if (p.length) return { d, p:p[0] }; }
  return null;
}
const checksOf = (nat, rid) => S.checks[nat + '|' + rid] || [];

/* ---------- Tâches espacées ---------- */
const PER = { semaine:7, mois:30.44, an:365.25 };
const interval = e => PER[e.per] / Math.max(1, e.n);
const freqLabel = e => `${e.n} fois par ${e.per}`;
function etat(e){
  if (!e.fait) return { due:true, label:'À faire', rest:-999 };
  const rest = Math.round(interval(e) - diffDays(e.fait, today()));
  if (rest <= 0) return { due:true, label:'À faire', rest };
  const label = rest < 14 ? `Dans ${rest} j` : rest < 60 ? `Dans ${Math.round(rest/7)} sem.` : `Dans ${Math.round(rest/30.44)} mois`;
  return { due:false, label, rest };
}

/* ---------- Navigation ---------- */
let tab = 'jour';
try { const t = sessionStorage.getItem('mr.tab'); if (t) tab = t; } catch(e){}
let curDate = today();
const TABS = ['jour','semaine','espacees','fiches'];

function setTab(t, push = true){
  tab = t;
  try { sessionStorage.setItem('mr.tab', t); } catch(e){}
  if (t === 'jour' && push) curDate = today();
  render();
  window.scrollTo(0,0);
}

/* ---------- Rendu ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const m = document.getElementById('main');
  m.innerHTML = tab === 'jour' ? vJour() : tab === 'semaine' ? vSemaine() : tab === 'espacees' ? vEspacees() : vFiches();
  wake();
}

function vJour(){
  const D = curDate, isToday = D === today();
  const ps = passagesFor(D);
  let h = `<div class="weeknav" style="margin-bottom:12px">
    <button class="arrow" data-act="day" data-n="-1" aria-label="Jour précédent">‹</button>
    <div class="center"><div class="sc mu">${esc(longDate(D))}</div>${isToday ? '' : `<button class="small au" data-act="day" data-n="0" style="margin-top:4px">Revenir à aujourd'hui</button>`}</div>
    <button class="arrow" data-act="day" data-n="1" aria-label="Jour suivant">›</button></div>`;
  if (!ps.length){
    const nx = nextPassage(D);
    h += `<div class="frame"><div class="in center empty">
      <div class="mono">·</div>
      <div class="h2" style="margin-top:12px">Pas de passage</div>

    </div></div>`;
    return h;
  }
  for (const p of ps) h += blocPassage(p, D);
  return h;
}

function blocPassage(p, D){
  const r = p.res, ch = checksOf(p.nat, r.id);
  const total = r.checklist.length, done = r.checklist.filter(t => ch.includes(t.id)).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const dues = S.espacees.filter(e => e.res === r.id && etat(e).due);
  let h = `<div class="frame"><div class="in">
    <div class="center">
      <div class="mono">${esc(r.mono)}</div>
      <div class="title">${esc(r.court)}</div>

    </div>
    <div class="orn"><i></i></div>
    <div style="display:flex;justify-content:space-between" class="mu small"><span class="sc">Checklist</span><span><span class="au">${done}</span> / ${total}</span></div>
    <div class="bar"><div style="width:${pct}%"></div></div>`;
  for (const t of r.checklist){
    const on = ch.includes(t.id);
    h += `<button class="it${on ? ' on' : ''}" data-act="tick" data-nat="${p.nat}" data-res="${r.id}" data-t="${t.id}">
      <span class="bx">${CHECK}</span>
      <span><span class="tx">${esc(t.texte)}</span>${t.consigne ? `<span class="cons">— ${esc(t.consigne)}</span>` : ''}</span></button>`;
  }
  if (!total) h += `<div class="mu center" style="padding:14px 0;font-size:14px">Checklist vide. Ajoute des tâches dans Fiches.</div>`;
  if (dues.length){
    h += `<div class="box"><div class="sc center" style="margin-bottom:6px">À faire aussi</div>`;
    for (const e of dues) h += `<div class="row"><span><span class="serif" style="font-style:italic;font-size:15.5px">${esc(e.texte)}</span><br><span class="small" style="opacity:.8">${esc(freqLabel(e))}${e.duree ? ' · ' + esc(e.duree) : ''}</span></span>
      <button class="btn small" style="border-color:var(--dark);color:var(--dark)" data-act="esp" data-id="${e.id}">Voir</button></div>`;
    h += `</div>`;
  }
  if (r.notes && r.notes.trim()) h += `<div class="notes"><div class="sc mu" style="margin-bottom:6px">Notes</div>${esc(r.notes)}</div>`;
  return h + `</div></div>`;
}

let calMode = 'semaine', selDay = today(), monthStart = today().slice(0,8) + '01';
try { const c = sessionStorage.getItem('mr.cal'); if (c) calMode = c; } catch(e){}
const JC = ['','Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MOISC = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function espDoneOn(D){ return S.espacees.filter(e => (e.hist || []).includes(D) || e.fait === D); }
function passState(p){
  const r = p.res, ch = checksOf(p.nat, r.id), done = r.checklist.filter(t => ch.includes(t.id)).length, tot = r.checklist.length;
  return { done, tot, full: tot > 0 && done === tot };
}
function pastille(p, big){
  const st = passState(p), cls = p.moved ? 'mv' : st.full ? 'f' : 'e';
  return `<span class="pt ${cls}${big ? ' big' : ''}">${esc(p.res.mono)}</span>`;
}
function vSemaine(){
  let h = `<div class="center"><div class="sc mu">Planning</div><div class="h2">Mon calendrier</div></div>
  <div class="seg"><button class="${calMode === 'semaine' ? 'on' : ''}" data-act="cal" data-m="semaine">Semaine</button><button class="${calMode === 'mois' ? 'on' : ''}" data-act="cal" data-m="mois">Mois</button></div>`;
  return h + (calMode === 'mois' ? vMois() : vWeek());
}
function vWeek(){
  const W = monday(selDay), end = addDays(W, 6), dW = parse(W), dE = parse(end);
  const lab = dW.getMonth() === dE.getMonth() ? `${dW.getDate()} – ${dE.getDate()} ${MOISC[dE.getMonth()]}` : `${dW.getDate()} ${MOISC[dW.getMonth()]} – ${dE.getDate()} ${MOISC[dE.getMonth()]}`;
  let h = `<div class="weeknav" style="margin-bottom:12px">
    <button class="arrow" data-act="week" data-n="-7" aria-label="Semaine précédente">‹</button>
    <div class="center"><div class="serif au" style="font-style:italic;font-size:18px">${lab}</div>
    ${W !== monday(today()) ? `<button class="small au" data-act="week" data-n="0" style="margin-top:4px">Cette semaine</button>` : ''}</div>
    <button class="arrow" data-act="week" data-n="7" aria-label="Semaine suivante">›</button></div>
  <div class="frame"><div class="in" style="padding:14px 8px 12px"><div class="wk">`;
  for (let i = 0; i < 7; i++){
    const D = addDays(W, i), ps = passagesFor(D), esp = espDoneOn(D).length;
    h += `<button class="wc${D === today() ? ' t' : ''}${D === selDay ? ' s' : ''}" data-act="sel" data-d="${D}">
      <span class="wh">${JC[i+1]}</span><span class="wn">${parse(D).getDate()}</span>
      <span class="pts">${ps.length ? ps.map(p => pastille(p, true)).join('') : '<span class="pt z big"></span>'}</span>
      <span class="wd">${ps.length === 1 ? esc(ps[0].res.duree) : ''}</span>${esp ? '<span class="edot"></span>' : '<span class="edot z"></span>'}</button>`;
  }
  h += `</div>` + detailJour(selDay) + `</div></div>` + legende();
  return h;
}
function detailJour(D){
  const ps = passagesFor(D), esp = espDoneOn(D);
  let h = `<div class="det"><div class="sc mu center" style="margin-bottom:10px">${esc(longDate(D))}${D === today() ? ' · aujourd\'hui' : ''}</div>`;
  if (!ps.length) h += `<div class="center"><div class="serif au" style="font-style:italic;font-size:20px">Repos</div><div class="mu small">Aucun passage ce jour-là</div></div>`;
  for (const p of ps){
    const st = passState(p), pct = st.tot ? Math.round(st.done / st.tot * 100) : 0;
    h += `<div class="dp"><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:42px;height:42px;margin:0;font-size:17px">${esc(p.res.mono)}</span>
      <div style="flex:1"><div class="serif au" style="font-style:italic;font-size:20px">${esc(p.res.court)}</div>
      <div class="mu small">${esc(p.res.duree)}${p.moved ? ' · déplacé du ' + esc(longDate(p.nat)) : ''}</div></div>
      <div class="au small">${st.done}/${st.tot}</div></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="row2" style="margin-top:10px"><button class="btn fill small" data-act="open" data-d="${D}">Ouvrir la checklist</button><button class="btn small" data-act="move" data-nat="${p.nat}" data-res="${p.res.id}">Déplacer</button></div></div>`;
  }
  if (esp.length) h += `<div class="mu small" style="margin-top:10px">${esp.map(e => '· ' + esc(e.texte) + ' (' + esc(resById(e.res)?.court || '') + ') fait').join('<br>')}</div>`;
  return h + `</div>`;
}
function vMois(){
  const M0 = parse(monthStart), y = M0.getFullYear(), m = M0.getMonth();
  const first = monday(monthStart), days = new Date(y, m + 1, 0).getDate();
  const last = ymd(new Date(y, m, days)), lastW = addDays(monday(last), 6);
  const titre = MOIS[m].charAt(0).toUpperCase() + MOIS[m].slice(1) + ' ' + y;
  let h = `<div class="weeknav" style="margin-bottom:12px">
    <button class="arrow" data-act="month" data-n="-1" aria-label="Mois précédent">‹</button>
    <div class="center"><div class="serif au" style="font-style:italic;font-size:20px">${titre}</div>
    ${monthStart !== today().slice(0,8) + '01' ? `<button class="small au" data-act="month" data-n="0" style="margin-top:4px">Ce mois-ci</button>` : ''}</div>
    <button class="arrow" data-act="month" data-n="1" aria-label="Mois suivant">›</button></div>
  <div class="frame"><div class="in" style="padding:14px 8px 12px"><div class="mg">`;
  for (let i = 1; i <= 7; i++) h += `<span class="mh">${JC[i].charAt(0)}</span>`;
  for (let D = first; D <= lastW; D = addDays(D, 1)){
    const out = parse(D).getMonth() !== m, ps = out ? [] : passagesFor(D), esp = out ? 0 : espDoneOn(D).length;
    h += `<button class="mc${out ? ' o' : ''}${D === today() ? ' t' : ''}${!out && D === selDay ? ' s' : ''}" data-act="${out ? '' : 'sel'}" data-d="${D}">
      <span>${parse(D).getDate()}</span><span class="pts">${ps.map(p => pastille(p)).join('')}</span>${esp ? '<span class="edot abs"></span>' : ''}</button>`;
  }
  h += `</div>` + (parse(selDay).getMonth() === m && parse(selDay).getFullYear() === y ? detailJour(selDay) : '') + `</div></div>` + legende();
  return h;
}
function legende(){
  return `<div class="lg"><span><span class="pt f sm">G</span>fait</span><span><span class="pt e sm">G</span>à faire</span><span><span class="pt mv sm">É</span>déplacé</span><span><span class="edot" style="margin:0"></span>tâche espacée faite</span></div>`;

document.addEventListener('click', ev => {
  const nb = ev.target.closest('nav button');
  if (nb){ if (nb.dataset.tab !== tab) { vib(8); setTab(nb.dataset.tab); } else if (tab === 'jour' && curDate !== today()) setTab('jour'); return; }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch (a){
    case 'tick': {
      const k = d.nat + '|' + d.res, arr = S.checks[k] || (S.checks[k] = []);
      const i = arr.indexOf(d.t);
      if (i >= 0) arr.splice(i,1); else arr.push(d.t);
      save(); vib(15);
      const r = resById(d.res);
      if (i < 0 && r.checklist.every(t => arr.includes(t.id))) { vib([30,60,30]); toast('Passage terminé'); }
      render(); break;
    }
    case 'day': curDate = d.n === '0' ? today() : addDays(curDate, +d.n); render(); break;
    case 'week': selDay = d.n === '0' ? today() : addDays(selDay, +d.n); render(); break;
    case 'month': {
      if (d.n === '0'){ monthStart = today().slice(0,8) + '01'; selDay = today(); }
      else { const M = parse(monthStart); M.setMonth(M.getMonth() + (+d.n)); monthStart = ymd(M); selDay = (monthStart.slice(0,7) === today().slice(0,7)) ? today() : monthStart; }
      render(); break;
    }
    case 'cal': calMode = d.m; try { sessionStorage.setItem('mr.cal', calMode); } catch(e){} if (calMode === 'mois') monthStart = selDay.slice(0,8) + '01'; vib(8); render(); break;
    case 'sel': if (d.d) { selDay = d.d; vib(6); render(); } break;
    case 'open': curDate = d.d; tab = 'jour'; try { sessionStorage.setItem('mr.tab','jour'); } catch(e){} render(); window.scrollTo(0,0); break;
    case 'move': sheetMove(d.nat, d.res); break;
    case 'mvSave': {
      const v = val('mvd'); if (!v) { toast('Choisis une date'); break; }
      const nat = d.k.split('|')[0];
      if (v === nat) delete S.moves[d.k]; else S.moves[d.k] = v;
      save(); closeSheet(); render(); toast('Passage déplacé au ' + longDate(v)); break;
    }
    case 'mvReset': delete S.moves[d.k]; save(); closeSheet(); render(); toast('Passage remis au jour prévu'); break;
    case 'esp': sheetEsp(d.id); break;
    case 'espDone': { const e = S.espacees.find(x => x.id === d.id); e.fait = today(); e.hist = [...new Set([...(e.hist || []), today()])]; save(); vib(20); closeSheet(); render(); toast('Noté comme fait'); break; }
    case 'espDate': { const e = S.espacees.find(x => x.id === d.id), v = val('espd'); if (e.fait && e.hist) e.hist = e.hist.filter(x => x !== e.fait); e.fait = v || null; if (v) e.hist = [...new Set([...(e.hist || []), v])]; save(); sheetEsp(e.id); render(); break; }
    case 'espEdit': sheetEspEdit(d.id); break;
    case 'espNew': sheetEspEdit(null); break;
    case 'espSave': {
      const texte = val('f-texte'); if (!texte) { toast('Donne un nom à la tâche'); break; }
      const data = { res:val('f-res'), texte, n:Math.min(12, Math.max(1, parseInt(val('f-n')) || 1)), per:val('f-per'), duree:val('f-duree'), detail:val('f-detail'), consigne:val('f-cons') };
      if (d.id) Object.assign(S.espacees.find(x => x.id === d.id), data); else S.espacees.push({ id:uid(), fait:null, ...data });
      save(); closeSheet(); render(); toast('Enregistré'); break;
    }
    case 'espDel': if (confirm('Supprimer cette tâche espacée ?')) { S.espacees = S.espacees.filter(x => x.id !== d.id); save(); closeSheet(); render(); } break;
    case 'editCL': sheetCL(d.res); break;
    case 'clUp': case 'clDown': {
      const r = resById(d.res), i = +d.i, j = a === 'clUp' ? i - 1 : i + 1;
      if (j < 0 || j >= r.checklist.length) break;
      [r.checklist[i], r.checklist[j]] = [r.checklist[j], r.checklist[i]];
      save(); sheetCL(d.res); render(); break;
    }
    case 'clEdit': sheetTask(d.res, +d.i); break;
    case 'tSave': {
      const r = resById(d.res), texte = val('t-texte'), consigne = val('t-cons'), i = +d.i;
      if (!texte) { toast('Écris la tâche'); break; }
      if (i >= 0) Object.assign(r.checklist[i], { texte, consigne }); else r.checklist.push({ id:uid(), texte, consigne });
      save(); sheetCL(d.res); render(); break;
    }
    case 'tDel': if (confirm('Supprimer cette tâche ?')) { resById(d.res).checklist.splice(+d.i, 1); save(); sheetCL(d.res); render(); } break;
    case 'editRes': sheetRes(d.res); break;
    case 'chip': b.classList.toggle('on'); break;
    case 'resSave': {
      const r = resById(d.res);
      const court = val('r-court') || r.court;
      Object.assign(r, { nom:val('r-nom') || r.nom, court, mono:court.charAt(0).toUpperCase(), adresse:val('r-adr'), duree:val('r-duree'), infos:val('r-infos'),
        jours:[...document.querySelectorAll('#r-jours .chip.on')].map(c => +c.dataset.j) });
      save(); closeSheet(); render(); toast('Fiche enregistrée'); break;
    }
    case 'editContact': sheetContact(); break;
    case 'cSave': Object.assign(S.contact, { nom:val('c-nom'), tel:val('c-tel'), adresse:val('c-adr') }); save(); closeSheet(); render(); toast('Contact enregistré'); break;
  }
});

/* notes : enregistrement automatique */
let notesT;
document.addEventListener('input', ev => {
  const rid = ev.target.dataset && ev.target.dataset.notes; if (!rid) return;
  resById(rid).notes = ev.target.value;
  clearTimeout(notesT); notesT = setTimeout(save, 400);
});

/* ---------- Glisser entre les onglets ---------- */
let tx0 = null, ty0 = 0;
document.getElementById('main').addEventListener('touchstart', e => {
  if (sheetOpen || e.target.closest('input,textarea,select')) { tx0 = null; return; }
  tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY;
}, { passive:true });
document.getElementById('main').addEventListener('touchend', e => {
  if (tx0 === null) return;
  const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0;
  tx0 = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
  const i = TABS.indexOf(tab), j = dx < 0 ? i + 1 : i - 1;
  if (j >= 0 && j < TABS.length){ vib(8); setTab(TABS[j]); }
}, { passive:true });

/* ---------- Touche retour Android ---------- */
let exitArmed = false, exitT;
history.replaceState({ base:1 }, '');
history.pushState({ app:1 }, '');
window.addEventListener('popstate', () => {
  if (skipPop){ skipPop = false; return; }
  if (sheetOpen){ closeSheet(true); return; }
  if (tab !== 'jour' || curDate !== today()){ history.pushState({ app:1 }, ''); setTab('jour'); return; }
  if (exitArmed){ history.back(); return; }
  exitArmed = true; toast('Appuie encore pour quitter');
  history.pushState({ app:1 }, '');
  clearTimeout(exitT); exitT = setTimeout(() => exitArmed = false, 2000);
});

/* ---------- Écran allumé pendant un passage ---------- */
let lock = null;
async function wake(){
  const need = tab === 'jour' && passagesFor(curDate).length > 0 && document.visibilityState === 'visible';
  try {
    if (need && !lock && 'wakeLock' in navigator){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); }
    else if (!need && lock){ await lock.release(); lock = null; }
  } catch(e){ lock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ render(); } else wake(); });

/* ---------- Hors ligne ---------- */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

render();
</script>
